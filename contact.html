<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Edit the browser tab title below -->
  <title>Contact — Rakshith Anumalasetty</title>
  <link rel="stylesheet" href="style.css" />
</head>

<!-- data-page="5" sets the active nav dot (5 = Contact) -->
<body data-page="5">

  <!-- Custom cursor elements -->
  <div class="cursor"></div>
  <div class="cursor-ring"></div>

  <!-- Animated background layers -->
  <div class="bg-canvas"></div>

  <!-- Floating particles layer -->
  <div class="particles"></div>

  <!-- Subtle scanlines overlay -->
  <div class="scanlines"></div>

  <!-- ======== NAVIGATION ======== -->
  <nav class="nav">
    <!-- Edit the brand/logo text below -->
    <span class="nav-brand">AVR</span>

    <!-- Nav dots: active dot = index 5 -->
    <div class="nav-dots">
      <div class="nav-dot" data-index="0" title="Home"></div>
      <div class="nav-dot" data-index="1" title="Education"></div>
      <div class="nav-dot" data-index="2" title="Skills"></div>
      <div class="nav-dot" data-index="3" title="Projects"></div>
      <div class="nav-dot" data-index="4" title="Certificates"></div>
      <div class="nav-dot" data-index="5" title="Contact"></div>
    </div>
  </nav>

  <!-- ======== CONTACT PAGE CONTENT ======== -->
  <main class="page page-transition">

    <!-- Page Header -->
    <header class="page-header" style="margin-bottom: 36px;">
      <!-- Small label — edit this text -->
      <p class="page-header-label">Let's Connect</p>
      <!-- Page title — edit this text -->
      <h1 class="page-title">Contact Details</h1>
      <div class="page-divider"></div>
    </header>

    <!-- Contact Cards Grid -->
    <!-- Each .contact-item is a clickable link; edit href and the .contact-value text -->
    <div class="contact-grid" style="animation: fadeSlideUp 0.7s 0.4s both;">

      <!-- ======== EMAIL ======== -->
      <!-- Edit href="mailto:..." and the .contact-value text below -->
      <a href="mailto:ramana.anumalasetty@gmail.com" class="contact-item">
        <div class="contact-icon-wrap">✉️</div>
        <div>
          <div class="contact-label">Email</div>
          <!-- Edit your email address here -->
          <div class="contact-value">ramana.anumalasetty@gmail.com</div>
        </div>
      </a>

      <!-- ======== PHONE ======== -->
      <!-- Edit href="tel:..." and the .contact-value text below -->
      <a href="tel:+919347961603" class="contact-item">
        <div class="contact-icon-wrap">📱</div>
        <div>
          <div class="contact-label">Phone</div>
          <!-- Edit your phone number here -->
          <div class="contact-value">+91 9347961603</div>
        </div>
      </a>

      <!-- ======== LINKEDIN ======== -->
      <!-- Edit href to your actual LinkedIn profile URL -->
      <a href="https://www.linkedin.com/in/venkata-ramana-rakshith-anumalasetty-7883aa37b/" target="_blank" rel="noopener" class="contact-item">
        <div class="contact-icon-wrap">💼</div>
        <div>
          <div class="contact-label">LinkedIn</div>
          <!-- Edit your LinkedIn handle/URL text -->
          <div class="contact-value">linkedin.com/in/venkata-ramana-rakshith-anumalasetty</div>
        </div>
      </a>

      <!-- ======== GITHUB ======== -->
      <!-- Edit href to your actual GitHub profile URL -->
      <a href="https://github.com/ramana-anumala" target="_blank" rel="noopener" class="contact-item">
        <div class="contact-icon-wrap">🐙</div>
        <div>
          <div class="contact-label">GitHub</div>
          <!-- Edit your GitHub username/URL text -->
          <div class="contact-value">github.com/ramana-anumala</div>
        </div>
      </a>

    </div>

    <!-- OPTIONAL: Add more contact items here (e.g., Twitter, Portfolio link) -->
    <!-- Copy a .contact-item block above and paste inside .contact-grid -->

    <!-- Return to Home button -->
    <div class="btn-group">
      <a href="index.html" class="btn btn-accent">
        <span style="transform: rotate(180deg); display: inline-block; margin-right: 4px;">→</span>
        Return to First Page
      </a>
    </div>

  </main>

  <!-- Footer label -->
  <div class="footer-note">Page 06 / 06 — Contact</div>

  <script src="script.js"></script>
</body>
</html>
