<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Edit the browser tab title below -->
  <title>Rakshith Anumalasetty — Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>

<!-- data-page="0" sets the active nav dot (0 = Home) -->
<body data-page="0">

  <!-- Custom cursor elements -->
  <div class="cursor"></div>
  <div class="cursor-ring"></div>

  <!-- Animated background layers -->
  <div class="bg-canvas"></div>

  <!-- Floating particles layer -->
  <div class="particles"></div>

  <!-- Subtle scanlines overlay -->
  <div class="scanlines"></div>

  <!-- ======== NAVIGATION ======== -->
  <nav class="nav">
    <!-- Edit the brand/logo text below -->
    <span class="nav-brand">RA</span>

    <!-- Nav dots: one dot per page (6 pages total), index 0–5 -->
    <div class="nav-dots">
      <div class="nav-dot" data-index="0" title="Home"></div>
      <div class="nav-dot" data-index="1" title="Education"></div>
      <div class="nav-dot" data-index="2" title="Skills"></div>
      <div class="nav-dot" data-index="3" title="Projects"></div>
      <div class="nav-dot" data-index="4" title="Certificates"></div>
      <div class="nav-dot" data-index="5" title="Contact"></div>
    </div>
  </nav>

  <!-- ======== HOME PAGE CONTENT ======== -->
  <main class="page page-transition">

    <section class="hero">

      <!-- Small label above the main title — edit this text -->
      <p class="hero-eyebrow">Welcome to my digital space</p>

      <!-- MAIN TITLE — Edit this text -->
      <h1 class="hero-title">This is my Portfolio</h1>

      <!-- YOUR NAME — Edit this text -->
      <h2 class="hero-name">
        Rakshith Anumalasetty
        <span class="hero-name-line"></span>
      </h2>

      <!-- Navigation button to Education page -->
      <div class="btn-group">
        <a href="education.html" class="btn btn-primary">
          Education
          <span class="btn-arrow">→</span>
        </a>
      </div>

    </section>

  </main>

  <!-- Footer label -->
  <div class="footer-note">Page 01 / 06 — Home</div>

  <script src="script.js"></script>
</body>
</html>
